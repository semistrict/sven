  +import "strings"
  +
  +// NormalizeSKU accepts SKUs as printed on labels: lower case, with spaces.
  +func NormalizeSKU(s string) string {
  +	return strings.ToUpper(strings.ReplaceAll(strings.TrimSpace(s), " ", "-"))
